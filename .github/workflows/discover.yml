name: discover incidents

# run at an odd minute to avoid colliding with other scheduled jobs
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: discover
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # store GEMINI_API_KEY in this environment and restrict it to master in the repo settings
    environment: discover
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # no install scripts, and no secret in this step's environment
      - run: npm ci --ignore-scripts

      - name: discover
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run discover -- --provider gemini --from "$(date -u -d '2 days ago' +%F)"

      - name: open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/data/incidents.ts; then
            echo "no new incidents"
            exit 0
          fi

          today="$(date -u +%F)"
          branch="discover/${today}-${{ github.run_number }}"
          title="ci: add incidents discovered on ${today}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add src/data/incidents.ts
          git commit -m "$title"
          git push origin "$branch"

          gh pr create --base master --head "$branch" --title "$title" \
            --body "Incidents found by the daily discover run. Review each entry and archive any \`TODO: archive manually\` sources before merging."
